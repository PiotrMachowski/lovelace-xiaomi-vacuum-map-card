name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the file
        run: |
          npm ci
          npm version --git-tag-version=false --commit-hooks=false --allow-same-version "${{ github.event.release.tag_name }}"
          npm run build

      - name: Upload build result to release
        uses: svenstaro/upload-release-action@v1-release

        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/xiaomi-vacuum-map-card.js
          asset_name: xiaomi-vacuum-map-card.js
          tag: ${{ github.ref }}
          overwrite: true
