name: Request support for a new vacuum platform
description: Request support for a new vacuum platform in Better Xiaomi Vacuum Map Card.
labels:
  - new platform
  - enhancement
assignees: 'Igloczek'
body:
  - type: markdown
    attributes:
      value: |
        Using this form you can create a request for a new supported platform.

        Platform templates are shared with upstream, so a request that applies to the upstream card
        as well belongs in the
        [upstream tracker](https://github.com/PiotrMachowski/lovelace-xiaomi-vacuum-map-card/issues).
        The fork only adds a template when a state/registry dump from a real instance can back it;
        see [Adding a new platform](https://github.com/Igloczek/lovelace-better-xiaomi-vacuum-map-card/blob/master/CONTRIBUTING.md#adding-new-platform).
  - type: input
    validations:
      required: true
    attributes:
      label: Integration repository
      description: >-
        Link to a repository that contains the integration
      placeholder: https://www.home-assistant.io/integrations/xiaomi_miio/
      value: https://www.home-assistant.io/integrations/xiaomi_miio/
  - type: checkboxes
    attributes:
      label: Supported features
      description: >-
        A list of features supported by the integration
      options:
        - label: Zone cleaning (using 4 coordinates)
        - label: Room cleaning (using room id/number)
        - label: Going to point (using 2 coordinates)
        - label: Cleaning a point (using 2 coordinates)
        - label: Others
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I can provide an anonymised state and entity-registry dump for this platform (no tokens, IPs or serial numbers)
          required: false
  - type: textarea
    validations:
      required: true
    attributes:
      label: Vacuum entity/entities
      description: |
        Please provide example state and attributes of vacuum entity/entities (from dev-tools).
        Remove tokens, IP addresses and serial numbers.
      render: yaml
  - type: textarea
    validations:
      required: true
    attributes:
      label: Service calls
      description: |
        Please provide examples for all service calls that are supported by the integration.
      render: yaml
  - type: textarea
    validations:
      required: false
    attributes:
      label: Other info
