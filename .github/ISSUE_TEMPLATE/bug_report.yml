name: Report an issue with Better Xiaomi Vacuum Map Card
description: Report a bug in Better Xiaomi Vacuum Map Card (this fork).
labels: bug
assignees: 'Igloczek'
body:
  - type: markdown
    attributes:
      value: |
        **Faster: let an AI agent report it.** Describe the problem to your agent and it collects
        the details, removes private data and files the report for you; agent reports are handled
        first. See [Report a problem](https://github.com/Igloczek/lovelace-better-xiaomi-vacuum-map-card/blob/master/docs/report-a-problem.md).

        This issue form is for bugs in **Better Xiaomi Vacuum Map Card**, the fork, reported by hand.

        This is the fork's tracker; file fork bugs and fork regressions here. If the same
        configuration also fails with the upstream release, report it in the
        [upstream tracker](https://github.com/PiotrMachowski/lovelace-xiaomi-vacuum-map-card/issues)
        too. The element is still `custom:xiaomi-vacuum-map-card` and the asset is still
        `xiaomi-vacuum-map-card.js`, so include which build you run below.

        Configuration options are in
        [docs/configuration.md](https://github.com/Igloczek/lovelace-better-xiaomi-vacuum-map-card/blob/master/docs/configuration.md);
        platform setup is in
        [docs/platforms.md](https://github.com/Igloczek/lovelace-better-xiaomi-vacuum-map-card/blob/master/docs/platforms.md).

        Questions and feature requests have their own form.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have updated the card to the latest version available
          required: true
        - label: I have cleared the cache of my browser
          required: true
        - label: I have checked the documentation and the existing reports
          required: true
  - type: textarea
    validations:
      required: true
    attributes:
      label: The problem
      description: >-
        Describe the issue you are experiencing here.
  - type: markdown
    attributes:
      value: |
        ## Environment
  - type: dropdown
    id: card-build
    validations:
      required: true
    attributes:
      label: Which card build do you run?
      description: >-
        Choose the fork for this repository's builds, or upstream if the bug also happens with the
        upstream release. Reporting both makes the difference between a fork regression and an
        upstream bug.
      options:
        - Better Xiaomi Vacuum Map Card (this fork)
        - Upstream Xiaomi Vacuum Map Card
        - Both
  - type: input
    id: card-version
    validations:
      required: true
    attributes:
      label: What version of the card has described problem?
      placeholder: v1.0.1
      description: >-
        The release tag from the resource URL or the latest release page.
  - type: input
    id: last-working-card-version
    validations:
      required: false
    attributes:
      label: What was the last working version card?
      placeholder: vX.X.X
      description: >
        If known, otherwise leave blank.
  - type: input
    id: vacuum-model
    validations:
      required: true
    attributes:
      label: What vacuum model do you have problems with?
      placeholder: roborock.vacuum.s5e
  - type: input
    id: vacuum-integration
    validations:
      required: true
    attributes:
      label: Which integration do you use to control your vacuum (link)?
      description: Provide a link to (custom) integration that you use to control your vacuum.
      placeholder: https://www.home-assistant.io/integrations/xiaomi_miio/
      value: https://www.home-assistant.io/integrations/xiaomi_miio/
  - type: input
    id: browser
    validations:
      required: true
    attributes:
      label: What browser (browsers/apps) does have this problem?
      placeholder: Chrome/Safari/iOS app
  - type: input
    id: ha-version
    validations:
      required: true
    attributes:
      label: What version of Home Assistant do you use?
      placeholder: core-
      description: >
        Can be found in: [Configuration panel -> Info](https://my.home-assistant.io/redirect/info/).

        [![Open your Home Assistant instance and show your Home Assistant version information.](https://my.home-assistant.io/badges/info.svg)](https://my.home-assistant.io/redirect/info/)
  - type: dropdown
    validations:
      required: true
    attributes:
      label: What type of installation are you running?
      description: >
        Can be found in: [Configuration panel -> Info](https://my.home-assistant.io/redirect/info/).

        [![Open your Home Assistant instance and show your Home Assistant version information.](https://my.home-assistant.io/badges/info.svg)](https://my.home-assistant.io/redirect/info/)
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Supervised
        - Home Assistant Core
  - type: markdown
    attributes:
      value: |
        # Details
  - type: textarea
    validations:
      required: true
    attributes:
      label: Card's configuration
      description: |
        Please provide card's YAML configuration to help with problem reproduction. Remove
        tokens, IP addresses and serial numbers before posting.
      render: yaml
  - type: textarea
    attributes:
      label: Javascript errors shown in the browser's console (if applicable)
      description: For example, error message, or stack traces. ([How to open browser's console](https://webmasters.stackexchange.com/questions/8525/how-do-i-open-the-javascript-console-in-different-browsers))
      render: shell
  - type: textarea
    attributes:
      label: Additional information
      description: >
        If you have any additional information, use the field below.
