name: Triage report (agent-collected)
description: A redacted diagnostic bundle from the triage skill, for a bug in Better Xiaomi Vacuum Map Card.
title: ""
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for a report prepared by the triage skill (or by the manual checklist in
        [docs/triage.md](https://github.com/Igloczek/lovelace-better-xiaomi-vacuum-map-card/blob/master/docs/triage.md)).

        Attach `triage-report.md`, `triage-data.json`, `attachments/` and `fixture/` if the skill
        built one. Remove tokens, IP addresses, serial numbers, exact coordinates and anything else
        that reveals your home before submitting.

        If you are reporting a problem that also happens with the upstream card, say so below.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I reviewed the report and removed secrets, tokens, serial numbers and exact coordinates I do not want to share.
          required: true
        - label: I attached the triage bundle (or pasted the redacted report below).
          required: true
        - label: I checked the existing fork and upstream reports for the same problem.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behaviour
      description: What should happen, and what happens instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: The shortest numbered sequence from a clean dashboard.
      placeholder: |
        1. Open the dashboard with ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: card-version
    attributes:
      label: Card build and version
      description: Fork or upstream, and the version from the resource URL or release page.
      placeholder: Better Xiaomi Vacuum Map Card, v2.6.0
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version and installation type
      placeholder: 2026.11.0, Home Assistant OS
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Browser, app and operating system
      placeholder: Chrome 142 on macOS, or the iOS companion app
    validations:
      required: true
  - type: input
    id: vacuum
    attributes:
      label: Vacuum model and integration
      description: Entity id, model, integration name/version, and platform template.
      placeholder: vacuum.roborock_s7, Roborock core integration, platform Roborock
    validations:
      required: true
  - type: input
    id: map-source
    attributes:
      label: Map source
      description: Camera or image entity, and the camera integration.
      placeholder: camera.roborock_map, Xiaomi Cloud Map Extractor
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Card configuration (redacted)
      description: The YAML from the dashboard, with secrets and exact coordinates removed if needed.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Browser console errors, HA log excerpt, network counts, screenshots. Attach the full bundle instead of pasting everything.
      render: shell
  - type: textarea
    id: diagnosis
    attributes:
      label: Diagnosis and testability
      description: Suspected area, whether upstream also fails, what a fixture would prove.
  - type: input
    id: agent
    attributes:
      label: Triage provenance
      description: The agent and model that prepared the report, if applicable.
      placeholder: opencode + deepseek, 2026-11-14
  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Workarounds, related issues, or anything the template did not cover.
